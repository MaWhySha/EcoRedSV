{% extends 'base.html' %}

{% block titulo %}Eliminar{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card tarjeta-eco border-danger">
            <div class="card-body p-4 text-center">
                <i class="bi bi-exclamation-triangle text-danger" style="font-size: 2.5rem;"></i>
                <h1 class="h4 mt-2">¿Eliminar «{{ object }}»?</h1>
                <p class="text-muted">{{ aviso|default:'Esta acción no se puede deshacer.' }}</p>

                <form method="post" class="d-flex justify-content-center gap-2">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i> Sí, eliminar
                    </button>
                    <a href="{{ object.get_absolute_url }}" class="btn btn-outline-secondary">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
