{% extends 'base.html' %}

{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
        <div class="card tarjeta-eco">
            <div class="card-body p-4">
                <h1 class="h4 titulo-seccion text-center mb-4">
                    <i class="bi bi-person-circle"></i> Iniciar sesión
                </h1>

                {% if form.errors %}
                <div class="alert alert-danger">
                    El nombre de usuario o la contraseña no son correctos.
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Nombre de usuario</label>
                        <input type="text" name="username" id="id_username" class="form-control"
                            value="{{ form.username.value|default:'' }}" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Contraseña</label>
                        <input type="password" name="password" id="id_password" class="form-control" required>
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-eco w-100">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
